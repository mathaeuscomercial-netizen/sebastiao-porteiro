
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Seguro | Sebastião Porteiro™</title>

<style>
:root {
  color-scheme: dark;
  --fundo: #101e1a;
  --painel: #1b3028;
  --dourado: #c7a66a;
  --marfim: #f2ebda;
  --verde: #9fdbb1;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--fundo);
  color: var(--marfim);
  font-family: Georgia, serif;
}

main {
  width: 100%;
  max-width: 450px;
  padding: 36px 24px;
  background: var(--painel);
  border: 1px solid #756442;
  border-radius: 24px;
  text-align: center;
}

.simbolo { font-size: 50px; }

.marca {
  color: var(--dourado);
  letter-spacing: 4px;
  font-size: 12px;
}

h1 {
  font-size: 34px;
  font-weight: normal;
}

.descricao {
  color: #c5cfc6;
  line-height: 1.6;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 16px;
  background: var(--dourado);
  border: 0;
  border-radius: 12px;
  color: var(--fundo);
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button.secundario {
  background: transparent;
  color: var(--dourado);
  border: 1px solid var(--dourado);
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.quadro {
  margin-top: 24px;
  padding: 18px;
  background: var(--fundo);
  border: 1px solid #536454;
  border-radius: 14px;
  text-align: left;
}

.linha {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #34483c;
}

.linha:last-child { border: 0; }

.valor {
  text-align: right;
  color: var(--dourado);
  overflow-wrap: anywhere;
}

#status {
  margin-top: 22px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.ok { color: var(--verde); }
.erro { color: #ffb1ab; }

small {
  display: block;
  margin-top: 24px;
  color: #b1ad98;
  letter-spacing: 2px;
}

audio { display: none; }
</style>
</head>

<body>
<div id="amazon-root"></div>

<main>
  <div class="simbolo">🏰</div>
  <div class="marca">MASMORRA-SEDE</div>
  <h1>Sebastião Porteiro™</h1>

  <p class="descricao">
    Terminal seguro de comunicação
    <br>
    Laboratório WebRTC
  </p>

  <button id="entrar" disabled>
    Carregando Amazon...
  </button>

  <button id="microfone" class="secundario">
    Preparar microfone
  </button>

  <div id="status" aria-live="polite">
    Inicializando.
  </div>

  <div class="quadro">
    <div class="linha">
      <span>Conta Amazon</span>
      <span class="valor" id="amazonStatus">Aguardando</span>
    </div>

    <div class="linha">
      <span>Crachá digital</span>
      <span class="valor" id="crachaStatus">Aguardando</span>
    </div>

    <div class="linha">
      <span>Central AWS</span>
      <span class="valor" id="wsStatus">Desconectada</span>
    </div>

    <div class="linha">
      <span>Microfone</span>
      <span class="valor" id="micStatus">Inativo</span>
    </div>

    <div class="linha">
      <span>WebRTC</span>
      <span class="valor" id="rtcStatus">Aguardando</span>
    </div>

    <div class="linha">
      <span>Última mensagem</span>
      <span class="valor" id="ultimaMensagem">Nenhuma</span>
    </div>
  </div>

  <audio id="audioRemoto" autoplay playsinline></audio>

  <small>SEBASTIÃO SYSTEMS • LABORATÓRIO 04</small>
</main>

<script>
(function () {
  "use strict";

  const CLIENT_ID =
    "amzn1.application-oa2-client.b48ae2009d2241679b0a2f8b3f09cb42";

  const EMISSOR =
    "https://yfy6x3xbsn4ntldhfypaz5gkoa0jgsmy.lambda-url.us-east-1.on.aws/";

  const WEBSOCKET =
    "wss://b0z9d37i01.execute-api.us-east-1.amazonaws.com/dev";

  const $ = id => document.getElementById(id);

  const botao = $("entrar");
  const botaoMicrofone = $("microfone");

  let amazonPronta = false;
  let socket = null;
  let conexaoRTC = null;
  let fluxoLocal = null;
  let validade = 0;

  function mensagem(texto, classe = "") {
    $("status").textContent = texto;
    $("status").className = classe;
  }

  function liberarBotao() {
    botao.disabled = false;
    botao.textContent = "Entrar e conectar";
  }

  function fecharRTC() {
    if (conexaoRTC) {
      conexaoRTC.close();
      conexaoRTC = null;
    }
  }

  function fecharSocket() {
    if (socket) {
      const anterior = socket;
      socket = null;
      anterior.onclose = null;
      anterior.close();
    }
  }

  botaoMicrofone.addEventListener("click", async function () {
    try {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("Microfone indisponível no navegador.");
      }

      if (!fluxoLocal) {
        fluxoLocal = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });
      }

      $("micStatus").textContent = "Preparado";
      botaoMicrofone.textContent = "Microfone preparado";
      botaoMicrofone.disabled = true;

      mensagem("Microfone preparado para a chamada.", "ok");

    } catch (erro) {
      $("micStatus").textContent = "Falha";
      mensagem("Microfone: " + erro.message, "erro");
    }
  });

  function esperarICE(pc) {
    if (pc.iceGatheringState === "complete") {
      return Promise.resolve(true);
    }

    return new Promise(resolve => {
      let terminado = false;

      function finalizar(completo) {
        if (terminado) return;
        terminado = true;
        clearTimeout(limite);
        pc.removeEventListener(
          "icegatheringstatechange",
          verificar
        );
        resolve(completo);
      }

      function verificar() {
        if (pc.iceGatheringState === "complete") {
          finalizar(true);
        }
      }

      const limite = setTimeout(
        () => finalizar(false),
        8000
      );

      pc.addEventListener(
        "icegatheringstatechange",
        verificar
      );
    });
  }

  async function receberOferta(dados) {
    $("ultimaMensagem").textContent =
      "Oferta SDP da Alexa recebida";

    $("rtcStatus").textContent = "Processando oferta";

    const sdp = dados?.offer?.value;

    if (
      dados?.offer?.format !== "SDP" ||
      typeof sdp !== "string" ||
      !sdp.startsWith("v=0") ||
      typeof dados.sessionId !== "string"
    ) {
      $("rtcStatus").textContent = "Oferta inválida";
      mensagem("Oferta SDP inválida.", "erro");
      return;
    }

    fecharRTC();

    let pc;

    try {
      pc = new RTCPeerConnection({
        iceServers: [{
          urls: "stun:stun.l.google.com:19302"
        }]
      });

      conexaoRTC = pc;

      pc.ontrack = evento => {
        const audio = $("audioRemoto");

        if (evento.streams?.[0]) {
          audio.srcObject = evento.streams[0];
        } else {
          audio.srcObject = new MediaStream([evento.track]);
        }

        audio.play().catch(() => {
          mensagem(
            "Áudio recebido, mas o navegador " +
            "ainda não permitiu reprodução automática."
          );
        });
      };

      pc.onconnectionstatechange = () => {
        $("rtcStatus").textContent =
          "Conexão: " + pc.connectionState;
      };

      if (fluxoLocal) {
        fluxoLocal.getAudioTracks().forEach(track => {
          pc.addTrack(track, fluxoLocal);
        });
      }

      await pc.setRemoteDescription({
        type: "offer",
        sdp
      });

      const resposta = await pc.createAnswer();

      await pc.setLocalDescription(resposta);

      const iceCompleto = await esperarICE(pc);

      if (!iceCompleto) {
        throw new Error(
          "Coleta ICE incompleta. Resposta não enviada."
        );
      }

      const respostaSDP =
        pc.localDescription?.sdp;

      if (
        typeof respostaSDP !== "string" ||
        !respostaSDP.startsWith("v=0")
      ) {
        throw new Error("Resposta SDP não gerada.");
      }

      if (socket?.readyState !== WebSocket.OPEN) {
        throw new Error("WebSocket desconectado.");
      }

      socket.send(JSON.stringify({
        action: "webrtc_answer",
        sessionId: dados.sessionId,
        answer: {
          format: "SDP",
          value: respostaSDP
        }
      }));

      $("rtcStatus").textContent = "Resposta enviada";

      mensagem(
        "Resposta SDP enviada à AWS!",
        "ok"
      );

    } catch (erro) {
      $("rtcStatus").textContent = "Falha WebRTC";

      mensagem(
        "Falha ao processar oferta: " + erro.message,
        "erro"
      );

      if (socket?.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          action: "webrtc_error",
          sessionId: dados.sessionId,
          message: "Falha na negociação do terminal"
        }));
      }

      if (pc) pc.close();

      if (conexaoRTC === pc) {
        conexaoRTC = null;
      }
    }
  }

  function conectarWebSocket(token) {
    if (!token || Date.now() >= validade) {
      mensagem("Crachá expirado.", "erro");
      liberarBotao();
      return;
    }

    fecharSocket();
    fecharRTC();

    $("wsStatus").textContent = "Conectando...";

    socket = new WebSocket(
      WEBSOCKET + "?token=" + encodeURIComponent(token)
    );

    socket.onopen = () => {
      $("wsStatus").textContent = "Conectada";

      mensagem(
        "Terminal autenticado. Aguardando a Echo.",
        "ok"
      );

      socket.send(JSON.stringify({
        action: "teste",
        origem: "terminal-seguro"
      }));

      liberarBotao();
    };

    socket.onmessage = evento => {
      let dados;

      try {
        dados = JSON.parse(evento.data);
      } catch {
        $("ultimaMensagem").textContent =
          "Mensagem não reconhecida";
        return;
      }

      if (dados.action === "webrtc_offer") {
        receberOferta(dados);
        return;
      }

      $("ultimaMensagem").textContent =
        dados.mensagem ||
        dados.message ||
        dados.action ||
        "Resposta recebida";
    };

    socket.onerror = () => {
      $("wsStatus").textContent = "Falha";

      mensagem(
        "Conexão recusada pela central AWS.",
        "erro"
      );

      liberarBotao();
    };

    socket.onclose = () => {
      $("wsStatus").textContent = "Desconectada";
      fecharRTC();
    };
  }

  async function solicitarCracha(accessToken) {
    mensagem("AWS verificando identidade Amazon...");

    try {
      const resposta = await fetch(EMISSOR, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          access_token: accessToken
        }),
        cache: "no-store"
      });

      const dados = await resposta.json();

      if (!resposta.ok) {
        throw new Error(
          dados.erro || "Credencial recusada."
        );
      }

      if (
        typeof dados.token !== "string" ||
        dados.expiresIn !== 300 ||
        dados.terminalId !== "celular-teste"
      ) {
        throw new Error("Resposta inesperada da AWS.");
      }

      validade = Date.now() + 300000;

      $("crachaStatus").textContent = "Emitido: 5 min";

      conectarWebSocket(dados.token);

    } catch (erro) {
      $("crachaStatus").textContent = "Falha";
      mensagem(erro.message, "erro");
      liberarBotao();
    }
  }

  window.onAmazonLoginReady = function () {
    try {
      window.amazon.Login.setClientId(CLIENT_ID);

      amazonPronta = true;

      liberarBotao();
      mensagem("Pronto para autenticar.");

    } catch {
      mensagem("Falha ao iniciar Amazon.", "erro");
    }
  };

  botao.addEventListener("click", function () {
    if (!amazonPronta) return;

    botao.disabled = true;

    fecharRTC();
    fecharSocket();

    $("amazonStatus").textContent = "Autenticando";
    $("crachaStatus").textContent = "Aguardando";
    $("wsStatus").textContent = "Desconectada";
    $("rtcStatus").textContent = "Aguardando";

    mensagem("Aguardando login Amazon...");

    window.amazon.Login.authorize(
      {
        scope: "profile:user_id",
        pkce: true,
        popup: true,
        interactive: "always"
      },
      function (resultado) {
        if (resultado.error || !resultado.code) {
          mensagem("Login Amazon não concluído.", "erro");
          liberarBotao();
          return;
        }

        window.amazon.Login.retrieveToken(
          resultado.code,
          function (token) {
            if (
              token.error ||
              !token.success ||
              !token.access_token
            ) {
              mensagem("Falha no login Amazon.", "erro");
              liberarBotao();
              return;
            }

            $("amazonStatus").textContent = "Autorizada";

            solicitarCracha(token.access_token);
          }
        );
      }
    );
  });

  const script = document.createElement("script");

  script.id = "amazon-login-sdk";
  script.async = true;

  script.src =
    "https://assets.loginwithamazon.com/sdk/na/login1.js";

  script.onerror = () => {
    mensagem("Falha ao carregar Amazon.", "erro");
  };

  $("amazon-root").appendChild(script);

  setTimeout(() => {
    if (!amazonPronta) {
      mensagem(
        "A Amazon não concluiu a inicialização.",
        "erro"
      );
    }
  }, 12000);

})();
</script>
</body>
</html>
