
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autenticação | Sebastião Porteiro™</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #101e1a;
    color: #f2ebda;
    font-family: Georgia, serif;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 420px;
    padding: 38px 24px;
    text-align: center;
    background: #1b3028;
    border: 1px solid #675b3f;
    border-radius: 20px;
  }

  .icone {
    font-size: 46px;
    color: #c7a66a;
  }

  h1 {
    font-size: 29px;
    font-weight: normal;
  }

  p { line-height: 1.6; }

  button {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    background: #c7a66a;
    color: #101e1a;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:disabled {
    opacity: .6;
    cursor: wait;
  }

  #status {
    margin-top: 24px;
    overflow-wrap: anywhere;
  }

  .ok { color: #9fdbb1; }
  .erro { color: #ffabab; }

  .cartao {
    margin-top: 24px;
    padding: 18px;
    border: 1px solid #c7a66a;
    border-radius: 12px;
    background: #101e1a;
  }

  .cartao strong {
    display: block;
    color: #9fdbb1;
    font-size: 18px;
  }

  small { color: #c7bfae; }
</style>
</head>
<body>

<div id="amazon-root"></div>

<main>
  <div class="icone">♜</div>
  <h1>Sebastião Porteiro™</h1>
  <p>Central de autenticação</p>
  <small>Masmorra-Sede™</small>

  <button id="entrar" disabled>
    Carregando Amazon...
  </button>

  <div id="status" aria-live="polite">
    Preparando autenticação.
  </div>

  <div id="cartao" class="cartao" hidden>
    <strong>✓ Credencial emitida</strong>
    <p>Terminal: celular-teste</p>
    <small>Validade: 5 minutos</small>
  </div>
</main>

<script>
const CLIENT_ID =
  "amzn1.application-oa2-client.b48ae2009d2241679b0a2f8b3f09cb42";

const EMISSOR =
  "https://yfy6x3xbsn4ntldhfypaz5gkoa0jgsmy.lambda-url.us-east-1.on.aws/";

const botao = document.getElementById("entrar");
const status = document.getElementById("status");
const cartao = document.getElementById("cartao");

function mensagem(texto, classe = "") {
  status.textContent = texto;
  status.className = classe;
}

function finalizar() {
  botao.disabled = false;
  botao.textContent = "Autenticar novamente";
}

async function solicitarCracha(accessToken) {
  mensagem("AWS verificando identidade Amazon...");

  try {
    const resposta = await fetch(EMISSOR, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        access_token: accessToken
      }),
      cache: "no-store"
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      mensagem(
        "AWS recusou a solicitação (" +
        resposta.status + "): " +
        (dados.erro || "Falha desconhecida"),
        "erro"
      );
      return;
    }

    if (
      typeof dados.token !== "string" ||
      dados.terminalId !== "celular-teste" ||
      dados.expiresIn !== 300
    ) {
      mensagem(
        "A AWS retornou uma resposta inesperada.",
        "erro"
      );
      return;
    }

    // O crachá fica apenas na memória
    // desta página experimental.
    // Não é mostrado nem enviado ao WebSocket.
    window.credencialTerminal = dados.token;

    cartao.hidden = false;

    mensagem(
      "Conta autorizada! A AWS emitiu o " +
      "crachá digital do Sebastião.",
      "ok"
    );

  } catch (erro) {
    mensagem(
      "Não foi possível comunicar com a AWS. " +
      "Verifique a conexão ou a configuração CORS.",
      "erro"
    );
  } finally {
    finalizar();
  }
}

window.onAmazonLoginReady = function() {
  amazon.Login.setClientId(CLIENT_ID);
  botao.disabled = false;
  botao.textContent = "Solicitar crachá digital";
  mensagem("Pronto para autenticar.");
};

botao.addEventListener("click", function() {
  if (!window.amazon?.Login) {
    mensagem("Login Amazon indisponível.", "erro");
    return;
  }

  botao.disabled = true;
  cartao.hidden = true;
  window.credencialTerminal = null;

  mensagem("Aguardando autorização Amazon...");

  amazon.Login.authorize(
    {
      scope: "profile:user_id",
      pkce: true,
      popup: true,
      interactive: "always"
    },
    function(resultado) {
      if (resultado.error || !resultado.code) {
        mensagem(
          "Autorização Amazon não concluída.",
          "erro"
        );
        finalizar();
        return;
      }

      amazon.Login.retrieveToken(
        resultado.code,
        function(token) {
          if (
            token.error ||
            !token.success ||
            !token.access_token
          ) {
            mensagem(
              "Não foi possível obter o token Amazon.",
              "erro"
            );
            finalizar();
            return;
          }

          solicitarCracha(token.access_token);
        }
      );
    }
  );
};

const script = document.createElement("script");
script.src =
  "https://assets.loginwithamazon.com/sdk/na/login1.js";

script.onerror = function() {
  mensagem("Falha ao carregar a Amazon.", "erro");
};

document.head.appendChild(script);
</script>
</body>
</html>
